name: pipeline-watchdog
# Every transition in this pipeline is triggered by a GitHub event. That is the
# design's strength and its single point of failure: if a run dies between
# events — runner eviction, an API 5xx, the job timeout — no further event is
# ever produced and the pipeline stops silently, mid-story, forever.
#
# This is the only time-triggered thing in the repo. It re-dispatches a story
# that has gone quiet (implement-story already knows how to resume one) and
# otherwise re-runs the normal dispatch decision, which is a no-op when the
# pipeline is healthy, paused, or finished.
on:
  schedule:
    # Twice an hour, not once, because `schedule` does not merely run late -- it
    # silently drops firings. Over one observed day an hourly cron produced 9
    # runs out of 24, with a 7-hour hole between them. STALL_MINUTES is 90, so an
    # hourly tick could not meet its own deadline: the detector was offline
    # longer than the condition it detects. Ticks are near-free (the script exits
    # in seconds whenever a pipeline run is pending or nothing is in flight), so
    # buy the reliability back with redundancy.
    #
    # On the half hour by owner's instruction. Note this accepts the congestion
    # GitHub's docs warn about at :00, where every scheduled workflow on the
    # platform competes for one minute -- the :30 tick is the hedge against a
    # delayed or dropped :00.
    - cron: '0,30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without dispatching'
        type: boolean
        default: true

# Deliberately NOT the story-pipeline group the emitters share. Only one run per
# group may sit pending, and a newer arrival cancels the older pending one — so a
# watchdog tick queued behind story-start was evicted by the next pr-review, and
# the watchdog went dark exactly when the pipeline was busiest, which is exactly
# when a stall is most likely. It does not need the group: the script already
# refuses to act while any pipeline run is non-completed ("Active runs: ... Not
# stalled"), so mutual exclusion comes from that check, not from the queue.
concurrency:
  group: pipeline-watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Required, not an optimization. watchdog.mjs dates the last transition
          # with `git log -1 -- stories.json`, and checkout's default depth of 1
          # leaves a clone where every path looks created by the tip commit — so
          # that returns the last push to main whatever it touched. The stall
          # clock silently measured "time since anyone pushed" instead.
          fetch-depth: 0
      # setup-project is deliberately not used here: this job only runs the
      # pipeline's own scripts, so it needs the pipeline runtime and none of the
      # project's toolchain. Keeping it light means the recovery path still works
      # when the project's own build is what is broken.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look for a stalled story
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          REPO: ${{ github.repository }}
          STALL_MINUTES: '90'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node .github/scripts/watchdog.mjs
