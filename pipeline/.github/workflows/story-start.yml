name: story-start
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Select and print the plan without writing"
        type: boolean
        default: false
  repository_dispatch:
    types: [story-start]

concurrency:
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT }}
      - uses: ./.github/actions/setup-project
        with:
          playwright: 'true'
      - name: Materialize .env from repo secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .github/scripts/write-env.mjs
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PIPELINE_PAT }}
          prompt: "/implement-story ${{ inputs.dry_run && '(dry run - select and print the plan, write nothing)' || '' }}"
          # Default action permissions are read-only file ops + comments -- no Bash.
          # implement-story runs npm/wrangler/drizzle/playwright/git/gh; without this
          # every one of those calls is silently denied and the job "succeeds" having
          # done nothing (found bootstrapping Alvus-AI's US-001: 11 permission
          # denials, 0 output -- 21 turns and not one file touched).
          # 300, not 200: Alvus-AI's US-011 (auth backend + JWT middleware + admin
          # routes + React pages + Playwright demo) hit the 200-turn wall twice in a
          # row (2026-08-08, 201 turns / ~33-37m / ~$13-15 each, no PR opened either
          # time) while the 60m job timeout still had 25m+ of headroom unused.
          # Exhausting turns burns the whole run and forces a resume that re-reads all
          # the same context, which costs more than the extra turns would have -- and
          # a third identical failure trips the watchdog's retry breaker and escalates
          # to needs-human instead of finishing the story. Observed rate is ~6
          # turns/min, so 300 targets ~50-55m of Claude runtime, leaving buffer under
          # the 60m job timeout for setup/post steps.
          claude_args: --max-turns 300 --allowedTools "Bash,Edit,Write,Glob,Grep"
