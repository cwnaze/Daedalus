name: pr-review
on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # never run against forks: the job holds real secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Materialize .env from repo secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .github/scripts/write-env.mjs

      - name: Start local services (only if this project has any)
        run: |
          # Most projects are hosted-SaaS only (Turso, Resend, R2) and need
          # nothing here. This is a no-op unless a compose file exists.
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose up -d --wait
          else
            echo "No compose file — skipping."
          fi
      - name: Restore previous demo screenshots
        uses: actions/cache@v4
        with:
          path: docs/demos/assets
          key: demos-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: demos-${{ github.base_ref }}-
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PIPELINE_PAT }}
          prompt: /pr-review
          claude_args: --max-turns 100
