name: production-prep
on:
  workflow_dispatch:
  repository_dispatch:
    types: [production-prep]

concurrency:
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PIPELINE_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Materialize .env from repo secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .github/scripts/write-env.mjs

      - name: Start local services (only if this project has any)
        run: |
          # Most projects are hosted-SaaS only (Turso, Resend, R2) and need
          # nothing here. This is a no-op unless a compose file exists.
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose up -d --wait
          else
            echo "No compose file — skipping."
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PIPELINE_PAT }}
          prompt: /production-prep
          claude_args: --max-turns 200
