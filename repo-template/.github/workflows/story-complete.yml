name: story-complete
on:
  pull_request:
    types: [closed]

concurrency:
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  complete:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PIPELINE_PAT }}
      - name: Mark story done, close its issue, log
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/complete-story.mjs
      - name: Dispatch next story
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_PAT }}
        run: |
          # PIPELINE_PAT, not GITHUB_TOKEN: a workflow's own token cannot
          # trigger another workflow, and the chain would die here silently.
          if [ "$(jq -r '[.stories[] | select(.status != "done")] | length' stories.json)" -gt 0 ]; then
            gh api "repos/${{ github.repository }}/dispatches" \
              -f event_type=story-start
          else
            gh api "repos/${{ github.repository }}/dispatches" \
              -f event_type=production-prep
          fi
