name: pr-review
on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

concurrency:
  # Same group as story-start/pr-fix/story-complete: all four commit stories.json
  # to main, and two of them running at once means one push loses the race.
  # Serializing is free here — the invariant is one non-terminal story at a time.
  group: story-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # never run against forks: the job holds real secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (skipped before the app is scaffolded)
        run: |
          # Story 1 creates package.json. Until then there is nothing to install,
          # and an unconditional `npm ci` fails the very first run of the pipeline.
          if [ -f package-lock.json ]; then
            npm ci
            npx playwright install --with-deps chromium
          elif [ -f package.json ]; then
            npm install
            npx playwright install --with-deps chromium
          else
            echo "No package.json yet — this is the scaffolding story."
          fi
      - name: Materialize .env from repo secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: node .github/scripts/write-env.mjs

      - name: Start local services (only if this project has any)
        run: |
          # Most projects are hosted-SaaS only (Turso, Resend, R2) and need
          # nothing here. This is a no-op unless a compose file exists.
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            docker compose up -d --wait
          else
            echo "No compose file — skipping."
          fi
      - name: Restore previous demo screenshots
        uses: actions/cache@v4
        with:
          path: docs/demos/assets
          key: demos-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: demos-${{ github.base_ref }}-
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PIPELINE_PAT }}
          prompt: /pr-review
          claude_args: --max-turns 100
